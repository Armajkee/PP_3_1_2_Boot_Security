<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id != null} ? 'Edit User' : 'Add New User'"></title>
</head>
<body>
<h2 style="text-align:center;" th:text="${user.id != null} ? 'Edit User' : 'Add New User'"></h2>

<form th:action="@{/admin/update}" method="post">
    <input type="hidden" th:if="${user.id != null}" th:name="id" th:value="${user.id}"/>

    <div>
        <label>Username:</label><br/>
        <input type="text" name="username" th:value="${user.username}" required style="width:100%; padding:5px;"/>
    </div>
    <div>
        <label>Password:</label><br/>
        <input type="password" name="password" style="width:100%; padding:5px;"/>
    </div>
    <div>
        <label>Name:</label><br/>
        <input type="text" name="name" th:value="${user.name}" required style="width:100%; padding:5px;"/>
    </div>
    <div>
        <label>Email:</label><br/>
        <input type="email" name="email" th:value="${user.email}" required style="width:100%; padding:5px;"/>
    </div>
    <div>
        <label>Roles:</label><br/>
        <div th:each="role : ${allRoles}">
            <input type="checkbox" name="roles" th:value="${role.id}"
                   th:checked="${user.roles.contains(role)}"/> <span th:text="${role.name}"></span><br/>
        </div>
    </div>
    <div style="text-align:center; margin-top:10px;">
        <button type="submit" style="padding:5px 10px;">Save</button>
    </div>
</form>

<div style="text-align:center; margin-top:10px;">
    <a th:href="@{/admin}">Back to Admin Panel</a>
</div>
</body>
</html>
