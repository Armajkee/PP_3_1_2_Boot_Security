<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Page</title>
</head>
<body>
<h2>Welcome, Admin!</h2>
<p>You are logged in as <b th:text="${user.email}">admin email</b></p>

<h3>All Users:</h3>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Roles</th>
    </tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name} + ' ' + ${u.surname}">Name</td>
        <td th:text="${u.email}">email</td>
        <td th:each="r : ${u.roles}" th:text="${r} + ' '">ROLE</td>
    </tr>
</table>

<p><a href="/logout">Logout</a></p>
</body>
</html>
