<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 70px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .role-btn {
            width: 100%;
            background-color: white;
            color: #0d6efd;
            font-weight: 500;
            border: none;
            padding: 14px 25px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn:hover, .role-btn.active {
            background-color: #0d6efd;
            color: white;
        }

        /* Content */
        .content {
            margin-left: 220px;
            padding: 70px 20px 20px;
            min-height: 100vh;
        }

        .admin-header { font-weight: 500; font-size: 2.2rem; margin-bottom: 10px; }

        .top-buttons { display: flex; gap: 10px; margin-bottom: 0; }
        .top-btn {
            min-width: 120px;
            background-color: #f8f9fa;
            color: #0d6efd;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 5px;
            padding: 8px 0;
            transition: all 0.2s ease;
        }
        .top-btn:hover, .top-btn.active {
            background-color: white;
            border-color: #dee2e6;
            color: #6c757d;
        }

        .about-header {
            background-color: #f2f2f2;
            font-weight: 500;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 6px 6px 0 0;
            margin: 0;
        }

        .table-container, #addUserSection {
            background-color: white;
            border-radius: 6px;
            padding: 10px 10px 20px;
        }

        .hidden { display: none; }
        .visible { display: block; }

        /* Add User Section Styling */
        #addUserForm {
            text-align: center;
            margin-top: 15px; /* отступ сверху */
        }

        #addUserForm .form-group {
            margin-bottom: 12px;
        }

        #addUserForm label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            text-align: center;
        }

        #addUserForm input,
        #addUserForm select {
            display: block;
            margin: 0 auto 10px;
            max-width: 300px;
            text-align: center;
        }

        #addUserForm .btn-success {
            width: 150px;
            font-weight: 500;
            margin: 20px auto 0;
            display: block;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand"><span class="fw-bold">admin@mail.ru</span> &nbsp;with roles: ADMIN USER</a>
        <div class="d-flex">
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <a href="/admin" class="role-btn active">Admin</a>
    <a href="/user" class="role-btn">User</a>
</div>

<div class="content">
    <h2 class="admin-header">Admin panel</h2>

    <div class="top-buttons">
        <button id="usersTableBtn" class="top-btn active">Users table</button>
        <button id="newUserBtn" class="top-btn">New User</button>
    </div>

    <!-- Users Table -->
    <div id="usersTableSection" class="table-container visible mt-1">
        <div class="about-header">All users</div>
        <table class="table table-striped table-bordered table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <!-- Add User Form -->
    <div id="addUserSection" class="mt-1 hidden">
        <div class="about-header">Add new user</div>
        <form id="addUserForm">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" name="surname" required>
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" class="form-control" name="age" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select class="form-select" name="roles" id="add-roles" multiple size="2" required></select>
            </div>
            <button type="submit" class="btn btn-success text-white mt-3">Add new user</button>
        </form>
    </div>
</div>

<!-- Edit User Modal -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editUserForm" style="text-align: center;">
                <div class="modal-header">
                    <h5 class="modal-title">Edit user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">ID</label>
                        <input type="text" id="edit-id" readonly class="form-control" style="margin: 0 auto; max-width: 300px;" placeholder="ID">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">First Name</label>
                        <input type="text" id="edit-name" class="form-control" style="margin: 0 auto; max-width: 300px;" placeholder="First Name" required>
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Last Name</label>
                        <input type="text" id="edit-surname" class="form-control" style="margin: 0 auto; max-width: 300px;" placeholder="Last Name" required>
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Age</label>
                        <input type="number" id="edit-age" class="form-control" style="margin: 0 auto; max-width: 300px;" placeholder="Age" required>
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Email</label>
                        <input type="email" id="edit-email" class="form-control" style="margin: 0 auto; max-width: 300px;" placeholder="Email" required>
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Password</label>
                        <input type="password" id="edit-password" class="form-control" style="margin: 0 auto; max-width: 300px;" placeholder="Enter new password">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Role</label>
                        <select id="edit-roles" class="form-select" style="margin: 0 auto; max-width: 300px;" multiple size="2"></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete User Modal -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="deleteUserForm" style="text-align: center;">
                <div class="modal-header">
                    <h5 class="modal-title text-dark">Delete user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">ID</label>
                        <input type="text" id="delete-id" readonly class="form-control bg-light" style="margin: 0 auto; max-width: 300px;">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">First Name</label>
                        <input type="text" id="delete-name" readonly class="form-control bg-light" style="margin: 0 auto; max-width: 300px;">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Last Name</label>
                        <input type="text" id="delete-surname" readonly class="form-control bg-light" style="margin: 0 auto; max-width: 300px;">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Age</label>
                        <input type="number" id="delete-age" readonly class="form-control bg-light" style="margin: 0 auto; max-width: 300px;">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Email</label>
                        <input type="email" id="delete-email" readonly class="form-control bg-light" style="margin: 0 auto; max-width: 300px;">
                    </div>
                    <div class="form-group mb-2">
                        <label style="font-weight: 500; display: block;">Role</label>
                        <select id="delete-roles" class="form-select bg-light text-secondary" multiple disabled size="2" style="margin: 0 auto; max-width: 300px;"></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/main.js"></script>
</body>
</html>
