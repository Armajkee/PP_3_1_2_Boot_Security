<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
</head>
<body>
<h2 style="text-align:center;">Admin Panel</h2>

<div style="width:80%; margin:auto;">

    <!-- Add User + Sign Out -->
    <div style="margin-bottom:15px; text-align:right;">
        <a th:href="@{/admin/new}">
            <button style="padding:5px 10px; margin-right:10px;">Add New User</button>
        </a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="padding:5px 10px;">Sign Out</button>
        </form>
    </div>

    <!-- Users Table -->
    <table border="1" cellspacing="0" cellpadding="8" style="width:100%; border-collapse:collapse; text-align:center;">
        <thead style="background-color:#f0f0f0;">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Name</th>
            <th>Email</th>
            <th>Roles</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td>
                <span th:each="r : ${user.roles}" th:text="${r.name} + ' '"></span>
            </td>
            <td>
                <a th:href="@{/admin/edit(id=${user.id})}" style="margin-right:5px;">
                    <button style="padding:3px 8px;">Edit</button>
                </a>
                <form th:action="@{/admin/delete}" method="post" style="display:inline;">
                    <input type="hidden" th:name="id" th:value="${user.id}"/>
                    <button type="submit" style="padding:3px 8px;">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
