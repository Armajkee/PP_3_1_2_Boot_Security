<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>Create New User</h2>
    <form th:action="@{/admin/users}" th:object="${user}" method="post">
        <div class="mb-3">
            <label>Username</label>
            <input type="text" th:field="*{username}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Surname</label>
            <input type="text" th:field="*{surname}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Age</label>
            <input type="number" th:field="*{age}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Roles</label>
            <div th:each="role : ${allRoles}">
                <input type="checkbox" th:value="${role.id}" name="roles" th:text="${role.name}"> <span th:text="${role.name}"></span><br>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/admin" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
