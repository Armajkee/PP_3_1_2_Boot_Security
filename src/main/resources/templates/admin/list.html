<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 70px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .role-btn {
            width: 100%;
            background-color: white;
            color: #0d6efd;
            font-weight: 500;
            border: none;
            border-radius: 0;
            padding: 14px 25px;
            text-align: left;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .role-btn:hover {
            background-color: #0d6efd;
            color: white;
        }

        .role-btn.active {
            background-color: #0d6efd;
            color: white;
        }

        /* Content */
        .content {
            margin-left: 220px;
            padding: 70px 20px 20px;
            background-color: #f8f9fa;
            min-height: 100vh;
            position: relative;
        }

        /* Admin panel header */
        .admin-header {
            font-weight: 500;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /* Top buttons */
        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
        }

        .top-btn {
            min-width: 120px;
            background-color: #f8f9fa;
            color: #0d6efd;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 5px;
            padding: 8px 0;
            transition: all 0.2s ease;
        }

        .top-btn:hover {
            background-color: white;
            border-color: #dee2e6;
            color: #6c757d;
        }

        .top-btn.active {
            background-color: white;
            border-color: #dee2e6;
            color: #6c757d;
        }

        /* Заголовки таблицы и формы */
        .about-header {
            background-color: #f2f2f2;
            font-weight: 500;
            font-size: 1.2rem;
            padding: 10px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            margin: 0;
        }

        /* Резкое переключение между таблицей и формой */
        .table-container, #addUserSection {
            background-color: white;
            border-radius: 6px;
            padding: 10px 10px 20px 10px;
        }

        .hidden {
            display: none;
        }

        .visible {
            display: block;
            position: relative;
        }

        /* Кнопка Add new user чуть уже */
        #addUserForm .btn-success {
            width: 150px;
            font-weight: 500;
            margin: 20px auto 0 auto;
            display: block;
        }

        /* Modal center fields */
        .modal-body {
            text-align: center;
        }

        .modal-body .mb-2 {
            margin: 0 auto 15px;
            max-width: 250px;
        }

        .modal-body label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .modal-body select.form-select {
            text-align: left;
        }
    </style>
</head>
<body>
<!-- Верхняя панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand">
            <span class="fw-bold" th:text="${#authentication.name}">admin@mail.ru</span>
            &nbsp;with roles:
            <!-- iterate and place a space between roles -->
            <span th:each="r, iter : ${#authentication.principal.authorities}"
                  th:text="${#strings.replace(r.authority, 'ROLE_', '') + (iter.last ? '' : ' ')}">ADMIN USER</span>
        </a>
        <div class="d-flex">
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <!-- Admin кнопка всегда сверху, скрыта если роли нет -->
    <a th:href="@{/admin}" class="role-btn"
       th:classappend="${#httpServletRequest.requestURI.equals('/admin')} ? 'active' : ''"
       th:style="${#authorization.expression('hasRole(''ADMIN'')')} ? '' : 'display:none;'">Admin</a>

    <!-- User кнопка всегда снизу, скрыта если роли нет -->
    <a th:href="@{/user}" class="role-btn"
       th:classappend="${#httpServletRequest.requestURI.equals('/user')} ? 'active' : ''"
       th:style="${#authorization.expression('hasRole(''USER'')')} ? '' : 'display:none;'">User</a>
</div>

<!-- Контент -->
<div class="content">
    <h2 class="admin-header"
        th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'Admin panel' : 'User panel'}">Admin panel</h2>

    <div class="top-buttons">
        <button id="usersTableBtn" class="top-btn active">Users table</button>
        <button type="button" id="newUserBtn" class="top-btn">New User</button>
    </div>

    <!-- Таблица пользователей -->
    <div id="usersTableSection" class="table-container visible mt-1">
        <div class="about-header">All users</div>
        <table class="table table-striped table-bordered table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.surname}"></td>
                <td th:text="${user.age}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <!-- roles printed separated by a space, e.g. "ADMIN USER" -->
                    <span th:each="role, iter : ${user.roles}"
                          th:text="${#strings.replace(role.name, 'ROLE_', '') + (iter.last ? '' : ' ')}"></span>
                </td>
                <td>
                    <button type="button" class="btn btn-info btn-sm" data-bs-toggle="modal"
                            data-bs-target="#editUserModal"
                            th:attr="data-id=${user.id},data-name=${user.name},data-surname=${user.surname},data-age=${user.age},data-email=${user.email}">
                        Edit
                    </button>
                </td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal"
                            data-bs-target="#deleteUserModal"
                            th:attr="data-id=${user.id},data-name=${user.name},data-surname=${user.surname},data-age=${user.age},data-email=${user.email}">
                        Delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Новый пользователь (встроенная форма) -->
    <div id="addUserSection" class="mt-1 hidden">
        <div class="about-header">Add new user</div>
        <form id="addUserForm" th:action="@{/admin/users}" method="post">
            <div class="mb-2" style="margin-top:10px;">
                <label style="display:block; text-align:center; font-weight:500;">First Name</label>
                <input type="text" class="form-control" name="name" required style="margin:0 auto; max-width:300px;">
            </div>
            <div class="mb-2">
                <label style="display:block; text-align:center; font-weight:500;">Last Name</label>
                <input type="text" class="form-control" name="surname" required style="margin:0 auto; max-width:300px;">
            </div>
            <div class="mb-2">
                <label style="display:block; text-align:center; font-weight:500;">Age</label>
                <input type="number" class="form-control" name="age" required style="margin:0 auto; max-width:300px;">
            </div>
            <div class="mb-2">
                <label style="display:block; text-align:center; font-weight:500;">Email</label>
                <input type="email" class="form-control" name="email" required style="margin:0 auto; max-width:300px;">
            </div>
            <div class="mb-2">
                <label style="display:block; text-align:center; font-weight:500;">Password</label>
                <input type="password" class="form-control" name="password" required style="margin:0 auto; max-width:300px;">
            </div>
            <div class="mb-2">
                <label style="display:block; text-align:center; font-weight:500;">Role</label>
                <select class="form-select" name="roles" multiple required size="2"
                        style="margin:0 auto; max-width:300px; height:auto;">
                    <option th:each="role : ${allRoles}" th:value="${role.id}"
                            th:text="${#strings.replace(role.name,'ROLE_','')}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success text-white mt-3"
                    style="width:150px; display:block; margin:20px auto 0 auto;">Add new user</button>
        </form>
    </div>
</div>

<!-- Edit User Modal -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editUserForm" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Edit user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label>ID</label>
                        <input type="text" class="form-control" id="edit-id" name="id" readonly>
                    </div>
                    <div class="mb-2">
                        <label>First Name</label>
                        <input type="text" class="form-control" id="edit-name" name="name" required>
                    </div>
                    <div class="mb-2">
                        <label>Last Name</label>
                        <input type="text" class="form-control" id="edit-surname" name="surname" required>
                    </div>
                    <div class="mb-2">
                        <label>Age</label>
                        <input type="number" class="form-control" id="edit-age" name="age" required>
                    </div>
                    <div class="mb-2">
                        <label>Email</label>
                        <input type="email" class="form-control" id="edit-email" name="email" required>
                    </div>
                    <div class="mb-2">
                        <label>Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter new password">
                    </div>
                    <div class="mb-2">
                        <label>Role</label>
                        <select class="form-select" name="roles" id="edit-role" size="2" multiple
                                style="font-size: 0.9rem;">
                            <option th:each="role : ${allRoles}" th:value="${role.id}"
                                    th:text="${#strings.replace(role.name,'ROLE_','')}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete User Modal -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="deleteUserForm" method="post">
                <div class="modal-header">
                    <h5 class="modal-title text-dark">Delete user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="mb-2">
                        <label>ID</label>
                        <input type="text" class="form-control bg-light" id="delete-id" name="id" readonly>
                    </div>
                    <div class="mb-2">
                        <label>First Name</label>
                        <input type="text" class="form-control bg-light" id="delete-name" name="name" readonly>
                    </div>
                    <div class="mb-2">
                        <label>Last Name</label>
                        <input type="text" class="form-control bg-light" id="delete-surname" name="surname" readonly>
                    </div>
                    <div class="mb-2">
                        <label>Age</label>
                        <input type="number" class="form-control bg-light" id="delete-age" name="age" readonly>
                    </div>
                    <div class="mb-2">
                        <label>Email</label>
                        <input type="email" class="form-control bg-light" id="delete-email" name="email" readonly>
                    </div>
                    <div class="mb-2">
                        <label>Role</label>
                        <select class="form-select bg-light text-secondary" id="delete-role" name="roles" size="2"
                                multiple disabled style="font-size: 0.9rem;">
                            <option th:each="role : ${allRoles}" th:value="${role.id}"
                                    th:text="${#strings.replace(role.name,'ROLE_','')}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Переключение контента между таблицей и формой добавления
    const usersBtn = document.getElementById('usersTableBtn');
    const newUserBtn = document.getElementById('newUserBtn');
    const usersSection = document.getElementById('usersTableSection');
    const addUserSection = document.getElementById('addUserSection');

    usersBtn.addEventListener('click', () => {
        usersBtn.classList.add('active');
        newUserBtn.classList.remove('active');
        usersSection.classList.add('visible');
        usersSection.classList.remove('hidden');
        addUserSection.classList.add('hidden');
        addUserSection.classList.remove('visible');
    });

    newUserBtn.addEventListener('click', () => {
        newUserBtn.classList.add('active');
        usersBtn.classList.remove('active');
        addUserSection.classList.add('visible');
        addUserSection.classList.remove('hidden');
        usersSection.classList.add('hidden');
        usersSection.classList.remove('visible');
    });

    // Edit Modal logic
    const editUserModal = document.getElementById('editUserModal');
    editUserModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        const surname = button.getAttribute('data-surname');
        const age = button.getAttribute('data-age');
        const email = button.getAttribute('data-email');
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-name').value = name;
        document.getElementById('edit-surname').value = surname;
        document.getElementById('edit-age').value = age;
        document.getElementById('edit-email').value = email;
        // set action to update endpoint
        document.getElementById('editUserForm').setAttribute('action', '/admin/users/' + id);
    });

    // Delete Modal logic
    const deleteUserModal = document.getElementById('deleteUserModal');
    deleteUserModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        const surname = button.getAttribute('data-surname');
        const age = button.getAttribute('data-age');
        const email = button.getAttribute('data-email');
        document.getElementById('delete-id').value = id;
        document.getElementById('delete-name').value = name;
        document.getElementById('delete-surname').value = surname;
        document.getElementById('delete-age').value = age;
        document.getElementById('delete-email').value = email;
        // set action to delete endpoint
        document.getElementById('deleteUserForm').setAttribute('action', '/admin/users/' + id + '/delete');
    });
</script>
</body>
</html>
