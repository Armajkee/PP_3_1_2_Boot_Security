<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h2 style="text-align:center;">Login</h2>
<form th:action="@{/login}" method="post" style="width:300px; margin:auto; padding:20px; border:1px solid #ccc; border-radius:8px;">
    <div>
        <label>Username:</label><br/>
        <input type="text" name="username" required style="width:100%; padding:5px;"/>
    </div>
    <div>
        <label>Password:</label><br/>
        <input type="password" name="password" required style="width:100%; padding:5px;"/>
    </div>
    <div style="text-align:center; margin-top:10px;">
        <button type="submit" style="padding:5px 10px;">Sign In</button>
    </div>
</form>
</body>
</html>
