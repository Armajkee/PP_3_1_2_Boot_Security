<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
</head>
<body>
<h2>Welcome, User!</h2>
<p>You are logged in as <b th:text="${user.email}">user email</b></p>

<h3>Your Roles:</h3>
<ul>
    <li th:each="role : ${user.roles}" th:text="${role}">ROLE</li>
</ul>

<p><a href="/logout">Logout</a></p>
</body>
</html>
