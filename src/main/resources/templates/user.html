<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 70px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .role-btn {
            width: 100%;
            background-color: white;
            color: #0d6efd;
            font-weight: 500;
            border: none;
            border-radius: 0;
            padding: 14px 25px;
            text-align: left;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .role-btn:hover {
            background-color: #0d6efd;
            color: white;
        }

        .role-btn.active {
            background-color: #0d6efd;
            color: white;
        }

        /* Контент */
        .content {
            margin-left: 220px;
            padding: 100px 20px 20px;
        }

        /* Таблица */
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f8f9fa;
        }

        .table-striped tbody tr:nth-of-type(even) {
            background-color: #ffffff;
        }

        thead th {
            background-color: #ffffff;
            color: #000000;
        }

        .table-container {
            background-color: white;
            border-radius: 6px;
            padding: 10px;
        }

        .about-header {
            background-color: #f2f2f2;
            font-weight: 500;
            padding: 10px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
        }
    </style>
</head>
<body>

<!-- Верхняя панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand">
            <span class="fw-bold" th:text="${email}">user@mail.ru</span>
            &nbsp;with roles:
            <span th:each="r, iter : ${roles}"
                  th:text="${#strings.replace((r.name != null ? r.name : (r.authority != null ? r.authority : 'UNKNOWN')), 'ROLE_', '')} + ${iter.last ? '' : ' '}">
                USER
            </span>
        </a>
        <div class="d-flex">
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="sidebar">
    <!-- Admin всегда сверху -->
    <a th:href="@{/admin}" class="role-btn"
       th:classappend="${#httpServletRequest.requestURI.equals('/admin')} ? 'active' : ''"
       th:style="${#authorization.expression('hasRole(''ADMIN'')')} ? '' : 'display:none;'">Admin</a>

    <!-- User всегда снизу -->
    <a th:href="@{/user}" class="role-btn"
       th:classappend="${#httpServletRequest.requestURI.equals('/user')} ? 'active' : ''"
       th:style="${#authorization.expression('hasRole(''USER'')')} ? '' : 'display:none;'">User</a>
</div>

<!-- Контент -->
<div class="content">
    <h2 class="fw-bold">User Information Page</h2>

    <div class="table-container mt-3">
        <div class="about-header">About User</div>
        <table class="table table-striped table-bordered table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:object="${user}">
                <td th:text="*{id}">1</td>
                <td th:text="*{name}">User</td>
                <td th:text="*{surname}">user</td>
                <td th:text="*{age}">30</td>
                <td th:text="*{email}">user@mail.ru</td>
                <td>
                    <span th:each="r, iter : *{roles}"
                          th:text="${#strings.replace((r.name != null ? r.name : (r.authority != null ? r.authority : 'UNKNOWN')), 'ROLE_', '')} + ${iter.last ? '' : ' '}">
                        USER
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
